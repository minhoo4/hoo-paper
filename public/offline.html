<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#102f24" />
    <title>HOO | 오프라인</title>

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(
            circle at top right,
            rgba(116, 103, 216, 0.35),
            transparent 38%
          ),
          linear-gradient(
            145deg,
            #071c27,
            #102f24
          );
        color: white;
        font-family:
          Arial,
          "Malgun Gothic",
          sans-serif;
      }

      main {
        width: 100%;
        max-width: 420px;
        padding: 36px 28px;
        text-align: center;
        border: 1px solid
          rgba(255, 255, 255, 0.2);
        border-radius: 28px;
        background:
          rgba(8, 12, 22, 0.72);
        box-shadow:
          0 28px 80px
          rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(18px);
      }

      img {
        width: 96px;
        height: 96px;
        border-radius: 24px;
      }

      h1 {
        margin: 22px 0 0;
        font-size: 30px;
      }

      p {
        margin: 14px 0 0;
        color:
          rgba(255, 255, 255, 0.72);
        font-size: 15px;
        font-weight: 700;
        line-height: 1.7;
      }

      button {
        width: 100%;
        min-height: 50px;
        margin-top: 26px;
        border: 0;
        border-radius: 16px;
        background: #7467d8;
        color: white;
        font-size: 15px;
        font-weight: 900;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <main>
      <img
        src="/icons/hoo-icon-192.png"
        alt="HOO"
      />

      <h1>잠시 연결이 끊겼어요.</h1>

      <p>
        인터넷 연결을 확인한 뒤 다시 시도해주세요.
        연결이 복구되면 HOO의 기록을 다시 불러올 수 있어요.
      </p>

      <button
        type="button"
        onclick="window.location.reload()"
      >
        다시 연결하기
      </button>
    </main>
  </body>
</html>
